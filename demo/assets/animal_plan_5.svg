<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff; font-family:system-ui,sans-serif;">
  <defs>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0f7fa" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid5)" />
  
  <!-- Outer Frame -->
  <rect x="50" y="40" width="700" height="420" fill="none" stroke="#00695c" stroke-width="8" rx="4" />
  
  <!-- Title Block -->
  <rect x="500" y="410" width="245" height="45" fill="#e0f7fa" stroke="#00695c" stroke-width="1" />
  <text x="510" y="428" font-size="12" font-weight="bold" fill="#004d40">ANIMAL PLAN 5: COMMERCIAL BARN</text>
  <text x="510" y="444" font-size="10" fill="#00695c">Capacity: 40 Animals | 24.0m × 14.0m (3,200 sq.ft)</text>
  
  <!-- Bay 1 (North-West) -->
  <rect x="70" y="60" width="320" height="150" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" />
  <text x="230" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#00796b">BAY 1: MILKING CORRAL (10 STALLS)</text>
  <text x="230" y="125" text-anchor="middle" font-size="10" fill="#004d40">Automated Vacuum Line &amp; Sloped Gutter</text>

  <!-- Bay 2 (North-East) -->
  <rect x="410" y="60" width="320" height="150" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" />
  <text x="570" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#00796b">BAY 2: DRY COW RESTING BAY (10 HEAD)</text>
  <text x="570" y="125" text-anchor="middle" font-size="10" fill="#004d40">Rubber Comfort Mats over Grooved Concrete</text>

  <!-- Central Drive-Through Feed Corridor -->
  <rect x="70" y="220" width="660" height="60" fill="#fffde7" stroke="#ffd600" stroke-width="2" />
  <text x="400" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">CENTRAL TRACTOR FEED ALLEY &amp; CONTINUOUS RIDGE CHIMNEY (3.0m)</text>

  <!-- Bay 3 (South-West) -->
  <rect x="70" y="290" width="320" height="150" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" />
  <text x="230" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#00796b">BAY 3: HEIFER GROWING BAY (10 HEAD)</text>
  <text x="230" y="365" text-anchor="middle" font-size="10" fill="#004d40">Open Sided Natural Cross-Draft Inlets</text>

  <!-- Bay 4 (South-East) -->
  <rect x="410" y="290" width="320" height="150" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" />
  <text x="570" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#00796b">BAY 4: CALF NURSERY &amp; TREATMENT (10 HEAD)</text>
  <text x="570" y="365" text-anchor="middle" font-size="10" fill="#004d40">Individual Hutch Partitions &amp; Warm Straw</text>
</svg>
