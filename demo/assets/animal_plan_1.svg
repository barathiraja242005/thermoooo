<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff; font-family:system-ui,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f5e9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Outer Walls -->
  <rect x="50" y="40" width="700" height="420" fill="none" stroke="#2e7d32" stroke-width="6" rx="4" />
  
  <!-- Title Block -->
  <rect x="500" y="410" width="245" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" />
  <text x="510" y="428" font-size="12" font-weight="bold" fill="#1b5e20">ANIMAL PLAN 1: DAIRY CATTLE RIDGE BARN</text>
  <text x="510" y="444" font-size="10" fill="#33691e">Capacity: 20 Cows | 20.0m × 12.0m (2,400 sq.ft)</text>
  
  <!-- North Bay Stalls (Tail-to-Tail) -->
  <rect x="70" y="60" width="660" height="110" fill="#f1f8e9" stroke="#81c784" stroke-width="2" />
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">NORTH STALLS BAY (10 STANDING STALLS - TAIL FACING ALLEY)</text>
  
  <!-- Stall Partitions North -->
  <line x1="136" y1="90" x2="136" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="202" y1="90" x2="202" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="268" y1="90" x2="268" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="334" y1="90" x2="334" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="400" y1="90" x2="400" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="466" y1="90" x2="466" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="532" y1="90" x2="532" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="598" y1="90" x2="598" y2="170" stroke="#a5d6a7" stroke-width="2" />
  <line x1="664" y1="90" x2="664" y2="170" stroke="#a5d6a7" stroke-width="2" />
  
  <!-- North Manger Feeding Trough -->
  <rect x="70" y="60" width="660" height="30" fill="#c8e6c9" stroke="#4caf50" stroke-width="1.5" />
  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#1b5e20">North Continuous Feeding Manger &amp; Waterer (0.8m width)</text>

  <!-- Central Dung Channel / Cleaning Alley -->
  <rect x="70" y="170" width="660" height="25" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4" />
  <text x="400" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">North Dung Channel (1:40 Slope to Biogas Tank)</text>

  <!-- Central Walkway / Tractor Feeding Passage -->
  <rect x="70" y="195" width="660" height="110" fill="#fffde7" stroke="#fbc02d" stroke-width="2" />
  <text x="400" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#f57f17">CENTRAL AIRFLOW CORRIDOR &amp; FEEDING ALLEY (2.4m WIDTH)</text>
  <text x="400" y="265" text-anchor="middle" font-size="11" fill="#795548">🔥 Ridge Open Monitor Overhead (Stack Ventilation Thermal Chimney)</text>

  <!-- South Dung Channel -->
  <rect x="70" y="305" width="660" height="25" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4" />
  <text x="400" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">South Dung Channel (1:40 Slope to Biogas Tank)</text>

  <!-- South Bay Stalls -->
  <rect x="70" y="330" width="660" height="110" fill="#f1f8e9" stroke="#81c784" stroke-width="2" />
  <text x="400" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">SOUTH STALLS BAY (10 STANDING STALLS)</text>

  <!-- Stall Partitions South -->
  <line x1="136" y1="330" x2="136" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="202" y1="330" x2="202" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="268" y1="330" x2="268" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="334" y1="330" x2="334" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="400" y1="330" x2="400" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="466" y1="330" x2="466" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="532" y1="330" x2="532" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="598" y1="330" x2="598" y2="410" stroke="#a5d6a7" stroke-width="2" />
  <line x1="664" y1="330" x2="664" y2="410" stroke="#a5d6a7" stroke-width="2" />

  <!-- South Manger Feeding Trough -->
  <rect x="70" y="410" width="660" height="30" fill="#c8e6c9" stroke="#4caf50" stroke-width="1.5" />
  <text x="400" y="430" text-anchor="middle" font-size="11" fill="#1b5e20">South Continuous Feeding Manger &amp; Waterer (0.8m width)</text>

  <!-- Ventilation Openings -->
  <rect x="40" y="100" width="15" height="60" fill="#29b6f6" stroke="#0288d1" />
  <rect x="40" y="340" width="15" height="60" fill="#29b6f6" stroke="#0288d1" />
  <rect x="745" y="100" width="15" height="60" fill="#29b6f6" stroke="#0288d1" />
  <rect x="745" y="340" width="15" height="60" fill="#29b6f6" stroke="#0288d1" />
  
  <text x="18" y="135" font-size="10" font-weight="bold" fill="#0288d1" transform="rotate(-90 18,135)">WEST INLET</text>
  <text x="782" y="375" font-size="10" font-weight="bold" fill="#0288d1" transform="rotate(90 782,375)">EAST OUTLET</text>
</svg>
