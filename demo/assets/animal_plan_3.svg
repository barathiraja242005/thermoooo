<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff; font-family:system-ui,sans-serif;">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ede7f6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid3)" />
  
  <!-- Outer Frame -->
  <rect x="50" y="40" width="700" height="420" fill="none" stroke="#4527a0" stroke-width="6" rx="4" />
  
  <!-- Title Block -->
  <rect x="500" y="410" width="245" height="45" fill="#ede7f6" stroke="#4527a0" stroke-width="1" />
  <text x="510" y="428" font-size="12" font-weight="bold" fill="#311b92">ANIMAL PLAN 3: SHEEP &amp; GOAT BARN</text>
  <text x="510" y="444" font-size="10" fill="#512da8">Capacity: 50 Head | 15.0m × 8.0m (1,200 sq.ft)</text>
  
  <!-- Elevated Slatted Floor Bays -->
  <!-- Pen 1 -->
  <rect x="70" y="60" width="310" height="150" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" />
  <text x="225" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">PEN 1: DOES / EWES (15 HEAD)</text>
  <text x="225" y="125" text-anchor="middle" font-size="10" fill="#8e24aa">Elevated Wooden Slat Flooring (0.9m Clearance)</text>
  
  <!-- Pen 2 -->
  <rect x="400" y="60" width="330" height="150" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" />
  <text x="565" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">PEN 2: GROWING LAMBS / KIDS (20 HEAD)</text>
  <text x="565" y="125" text-anchor="middle" font-size="10" fill="#8e24aa">Elevated Wooden Slat Flooring (Natural Under-Draft)</text>

  <!-- Central Alley -->
  <rect x="70" y="220" width="660" height="60" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" />
  <text x="400" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">CENTRAL SERVICE, FODDER &amp; WATERER PASSAGE (1.5m WIDTH)</text>

  <!-- Pen 3 -->
  <rect x="70" y="290" width="310" height="150" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" />
  <text x="225" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">PEN 3: BUCKS / RAMS (5 HEAD)</text>
  <text x="225" y="365" text-anchor="middle" font-size="10" fill="#8e24aa">Reinforced Partition &amp; Dry Murrum Bed</text>

  <!-- Pen 4: Maternity / Sick Bay -->
  <rect x="400" y="290" width="330" height="150" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5" />
  <text x="565" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#004d40">PEN 4: MATERNITY &amp; QUARANTINE BAY (10 HEAD)</text>
  <text x="565" y="365" text-anchor="middle" font-size="10" fill="#00796b">Infrared Brooder Lamp &amp; Insulated Underlay</text>
</svg>
