<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Property Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #07090E; color: #F8FAFC; overflow: hidden; }
    select, button, a, [role="button"], .crumb {
      cursor: pointer !important;
    }
    input, textarea {
      caret-color: #00E5FF;
    }

    #file-warning {
      display: none; position: fixed; inset: 0; z-index: 100; background: rgba(7,9,14,.95);
      align-items: center; justify-content: center; padding: 2rem; text-align: center;
    }
    #file-warning.show { display: flex; flex-direction: column; gap: 1rem; }
    #file-warning code { background: #111827; padding: 8px 12px; border-radius: 6px; font-size: 14px; border: 1px solid rgba(255,255,255,0.1); color: #00E5FF; font-family: monospace; }
    #file-warning a { color: #00E5FF; font-weight: bold; font-size: 1.1rem; }
    #canvas-wrap { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 16px; right: 16px; padding: 10px 16px;
      background: rgba(14, 20, 32, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #hud h1 { font-size: .95rem; margin-right: auto; color: #00E5FF; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    select, button {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      color: #F8FAFC; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px;
      font-weight: 600; transition: all 0.18s ease; font-family: 'Plus Jakarta Sans', sans-serif;
    }
    select:hover, button:hover { border-color: rgba(0, 229, 255, 0.4); color: #00E5FF; }
    button.active { background: #00E5FF; color: #07090E; font-weight: 700; border-color: #00E5FF; box-shadow: 0 0 12px rgba(0,229,255,0.4); }
    button.on { background: rgba(0, 229, 255, 0.15); border-color: #00E5FF; color: #00E5FF; }
    #info {
      position: fixed; bottom: 16px; left: 16px; max-width: 380px;
      background: rgba(14, 20, 32, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 12px 16px; border-radius: 12px;
      font-size: 12px; line-height: 1.55; border: 1px solid rgba(0, 229, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #room-panel {
      position: fixed; top: 72px; right: 16px; width: 240px; max-height: 60vh; overflow-y: auto;
      background: rgba(14, 20, 32, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 14px; border-radius: 14px; font-size: 11px;
      border: 1px solid rgba(255,255,255,.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #room-panel h3 { font-size: 12px; color: #00E5FF; margin-bottom: 8px; font-weight: 800; }
    .room-block { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .room-block ul { padding-left: 14px; margin-top: 4px; color: #94A3B8; }
  </style>
</head>
<body>
  <div id="file-warning">
    <h2>⚠️ Open via local server (file:// won't work)</h2>
    <p>Browsers block 3D assets and data when opened as a file.<br>Run this in Terminal:</p>
    <code>python scripts/server.py</code>
    <p>Then open:</p>
    <a href="http://localhost:8765/demo/viewer/index.html">http://localhost:8765/demo/viewer/index.html</a>
  </div>

  <div id="hud">
    <h1>🕉️ 3D Property Viewer</h1>
    <select id="project-select"></select>
    <button id="btn-dollhouse" class="active">Dollhouse</button>
    <button id="btn-orbit">Orbit</button>
    <button id="btn-tour">▶ Walkthrough</button>
    <button id="btn-thermal" style="background: rgba(239, 68, 68, 0.25); border-color: #ef4444; color: #fca5a5;">🌡️ Thermal FLIR</button>
    <button id="btn-airflow" style="background: rgba(6, 182, 212, 0.25); border-color: #06b6d4; color: #67e8f9;">💨 CFD Airflow</button>
    <button id="btn-paths" class="on">Paths</button>
    <button id="btn-roof">Roof</button>
    <button id="btn-vastu">Vastu</button>
    <button id="btn-glb">Load GLB</button>
  </div>
  <div id="canvas-wrap"></div>
  <div id="info">Loading…</div>
  <div id="room-panel"></div>

  <!-- Surface Temperature Colorbar Legend for Thermal Mode -->
  <div id="thermal-legend" style="display: none; position: fixed; bottom: 16px; right: 16px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 12px; font-size: 11px; z-index: 20; color: #e2e8f0; pointer-events: none;">
    <div style="font-weight: 700; margin-bottom: 4px; color: #f87171; font-size: 10px; text-transform: uppercase;">Surface Temperature (°C)</div>
    <div style="height: 12px; width: 180px; border-radius: 4px; background: linear-gradient(90deg, #1565C0 0%, #00897B 25%, #FBC02D 60%, #E65100 85%, #D32F2F 100%); margin-bottom: 4px;"></div>
    <div style="display: flex; justify-content: space-between; font-family: monospace; font-size: 10px; color: #94a3b8;">
      <span>20°C</span>
      <span>24.8°C</span>
      <span>34°C</span>
      <span>44°C</span>
    </div>
  </div>

  <script src="projects-data.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }}
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { buildRealisticInterior, FLOOR_TOP } from './scene-builder.js';

  if (location.protocol === 'file:') {
    document.getElementById('file-warning').classList.add('show');
  }

  const DATA = window.CAD_PROJECTS;
  if (!DATA?.projects?.length) {
    document.getElementById('info').textContent = 'Missing projects-data.js — run: python scripts/build_viewer_bundle.py';
  }

  const VASTU = { best: 0x2e7d32, good: 0x66bb6a, bad: 0xffa726, worst: 0xef5350, unknown: 0x757575 };
  const LABELS = {
    sofa: 'Sofa', tv_unit: 'TV Unit', kitchen_counter: 'Kitchen', pooja_mandir: 'Pooja',
    bed_double: 'Bed', bed_single: 'Bed', dining_table: 'Dining', study_desk: 'Desk',
    fridge: 'Fridge', plant: 'Plant', ceiling_fan: 'Ceiling Fan', ceiling_light: 'Light',
    pendant_light: 'Pendant', floor_lamp: 'Lamp',
  };

  const urlParams = new URLSearchParams(window.location.search);
  const isEmbedded = (window.self !== window.top) || (urlParams.get('hidehud') === '1') || (urlParams.get('embed') === '1');

  if (isEmbedded) {
    const style = document.createElement('style');
    style.innerHTML = `
      #hud, #info, #room-panel, #thermal-legend, #file-warning { display: none !important; }
    `;
    document.head.appendChild(style);
  }

  let currentId = DATA?.projects?.[0]?.id;
  if (urlParams.get('project')) {
    const matched = DATA?.projects?.find(p => p.id === urlParams.get('project'));
    if (matched) currentId = matched.id;
  }
  let viewMode = urlParams.get('mode') || 'dollhouse';
  let showRoof = urlParams.get('roof') === '1';
  let showPaths = true;
  let loadedGlb = false;
  let showThermal = urlParams.get('thermal') === '1' || urlParams.get('mode') === 'thermal';
  let showAirflow = urlParams.get('airflow') === '1';

  let scene, camera, renderer, controls, interiorGroup, vastuGroup, ceilingGroup, sceneLights, tourPoints = [];
  let thermalGroup = new THREE.Group();
  let airflowGroup = new THREE.Group();
  let airflowParticles = [];
  let touring = false, tourT = 0;
  const DOLLHOUSE_WALL_H = 1.35;
  const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), DOLLHOUSE_WALL_H + 0.1);

  const sel = document.getElementById('project-select');
  DATA?.projects?.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = `${p.property.name} (${p.vastu?.compliance_score ?? '?'}/100)`;
    if (p.id === currentId) o.selected = true;
    sel.appendChild(o);
  });

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(showThermal ? 0x0a101d : 0xd8d4ce);
    scene.fog = new THREE.Fog(showThermal ? 0x0a101d : 0xd8d4ce, 28, 55);
    camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.08, 90);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 2.5;
    controls.maxDistance = 45;

    scene.add(new THREE.HemisphereLight(0xfff6ee, 0x8a9098, 0.55));
    const sun = new THREE.DirectionalLight(0xfff0e0, 0.85);
    sun.position.set(12, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 40;
    sun.shadow.camera.left = sun.shadow.camera.bottom = -14;
    sun.shadow.camera.right = sun.shadow.camera.top = 14;
    sun.shadow.bias = -0.0002;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.18));

    interiorGroup = new THREE.Group();
    ceilingGroup = new THREE.Group();
    vastuGroup = new THREE.Group();
    sceneLights = new THREE.Group();
    scene.add(interiorGroup, ceilingGroup, vastuGroup, sceneLights, thermalGroup, airflowGroup);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    requestAnimationFrame(tick);
  }

  function setCameraForMode(prop, WH) {
    const dw = prop.dimensions_m.width, dd = prop.dimensions_m.depth;
    const cx = dw / 2, cz = dd / 2;
    controls.target.set(cx, viewMode === 'walkthrough' ? 1.45 : 0.85, cz);
    if (viewMode === 'walkthrough' && tourPoints.length) {
      camera.position.copy(tourPoints[0].pos);
      camera.lookAt(tourPoints[0].look);
      controls.target.copy(tourPoints[0].look);
    } else if (viewMode === 'dollhouse') {
      const span = Math.max(dw, dd);
      camera.position.set(cx + span * 0.72, span * 0.82, cz + span * 0.78);
    } else {
      camera.position.set(cx + dw * 0.55, WH * 1.65, cz + dd * 0.62);
    }
    controls.update();
  }

  function applyRoofVisibility() {
    ceilingGroup.visible = showRoof;
    interiorGroup.traverse(obj => {
      if (obj.isMesh && /^Ceil_/i.test(obj.name)) obj.visible = showRoof;
    });
    document.getElementById('btn-roof').classList.toggle('on', showRoof);
    applyViewClipping();
  }

  function applyViewClipping() {
    const useClip = loadedGlb && viewMode === 'dollhouse';
    renderer.localClippingEnabled = useClip;
    renderer.clippingPlanes = useClip ? [clipPlane] : [];
    if (useClip) clipPlane.constant = DOLLHOUSE_WALL_H + 0.08;
    interiorGroup.traverse(obj => {
      if (!obj.isMesh) return;
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => {
        if (!m) return;
        m.clippingPlanes = useClip ? [clipPlane] : null;
        m.clipShadows = useClip;
        m.needsUpdate = true;
      });
    });
  }

  function buildScene(proj) {
    interiorGroup.clear();
    ceilingGroup.clear();
    vastuGroup.clear();
    sceneLights.clear();
    tourPoints = [];
    loadedGlb = false;

    const { property: prop, layout, vastu, catalog } = proj;
    const WH = layout.wall_height_m || 2.85;
    const WT = layout.wall_thickness_m || 0.12;
    const wallH = viewMode === 'dollhouse' ? DOLLHOUSE_WALL_H : WH;
    const roomVastu = {};
    vastu?.rooms?.forEach(r => { roomVastu[r.name] = r.status; });

    buildRealisticInterior({
      layout, catalog, interiorGroup, ceilingGroup, sceneLights,
      wallH, WH, WT, viewMode, showPaths,
    });

    if (document.getElementById('btn-vastu').classList.contains('active')) {
      for (const room of layout.rooms || []) {
        const r = room.rect;
        const cx = r.x + r.w / 2, cz = r.y + r.h / 2;
        const pl = new THREE.Mesh(
          new THREE.PlaneGeometry(r.w, r.h),
          new THREE.MeshBasicMaterial({ color: VASTU[roomVastu[room.name]] || 0x757575, transparent: true, opacity: 0.32 })
        );
        pl.rotation.x = -Math.PI / 2;
        pl.position.set(cx, FLOOR_TOP + 0.01, cz);
        vastuGroup.add(pl);
      }
    }

    const dw = prop.dimensions_m?.width || 14.4, dd = prop.dimensions_m?.depth || 11.2;
    tourPoints = (layout.camera_tour || []).map(p => ({
      pos: new THREE.Vector3(p.x, p.z !== undefined ? p.z : 1.5, p.y),
      look: p.look_at ? new THREE.Vector3(p.look_at[0], p.look_at[2] ?? 1.4, p.look_at[1]) : new THREE.Vector3(dw / 2, 1.4, dd / 2),
    }));

    setCameraForMode(prop, WH);
    applyRoofVisibility();

    const doorCount = layout.doors?.length || 0;
    document.getElementById('info').innerHTML =
      `<strong>${prop.name}</strong><br>${dw}×${dd}m · Facing ${prop.facing}` +
      `<br>View: <b>${viewMode}</b> · Roof ${showRoof ? 'on' : 'off'} · Paths ${showPaths ? 'on' : 'off'}` +
      `<br>Doors: ${doorCount} · Realistic PBR lighting` +
      (vastu ? `<br>Vastu: <b>${vastu.compliance_score}/100</b> (${vastu.grade})` : '') +
      (proj.astro?.lagna_sign ? `<br>Lagna: ${proj.astro.lagna_sign}` : '');

    const panel = document.getElementById('room-panel');
    panel.innerHTML = '<h3>Rooms & fixtures</h3>';
    for (const room of layout.rooms || []) {
      const pr = prop.rooms?.find(x => x.name === room.name);
      const vr = vastu?.rooms?.find(x => x.name === room.name);
      panel.innerHTML += `<div class="room-block"><b>${room.name}</b>${pr ? ` · ${pr.vastu_item}` : ''}<br>
        <span style="color:#aaa">${room.floor} · Vastu: ${vr?.status || '?'}</span>
        <ul>${(room.furniture||[]).map(f=>`<li>${LABELS[f.type]||f.type.replace(/_/g,' ')}</li>`).join('')}</ul></div>`;
    }
    if (layout.doors?.length) {
      panel.innerHTML += `<div class="room-block"><b>Doors</b><ul>${layout.doors.map(d=>`<li>${d.name}</li>`).join('')}</ul></div>`;
    }

    updateThermalState();
    initAirflowStreamlines();
  }

  function makeTextSprite(text, bgColor = 'rgba(13, 71, 161, 0.92)', textColor = '#ffffff', borderColor = '#42A5F5') {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 70;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = bgColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(6, 6, 244, 58, 12);
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = textColor;
    ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 35);
    
    const texture = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(2.4, 0.65, 1);
    return sprite;
  }

  // Exact 8-Stop Calibrated Thermal Gradient requested by User
  // Scale: 20°C -> 24°C -> 28°C -> 32°C -> 36°C -> 40°C -> 42°C -> 44°C
  const THERMAL_GRADIENT = [
    { label: "Very Cold",   color: new THREE.Color("#0033FF"), pos: 0.00, temp: 20.0 }, // 0%
    { label: "Cold",        color: new THREE.Color("#0066FF"), pos: 0.14, temp: 24.0 }, // 14%
    { label: "Cool",        color: new THREE.Color("#00CFFF"), pos: 0.28, temp: 28.0 }, // 28%
    { label: "Neutral",     color: new THREE.Color("#00FF66"), pos: 0.42, temp: 32.0 }, // 42%
    { label: "Warm",        color: new THREE.Color("#FFE600"), pos: 0.57, temp: 36.0 }, // 57%
    { label: "Hot",         color: new THREE.Color("#FF8C00"), pos: 0.72, temp: 40.0 }, // 72%
    { label: "Very Hot",    color: new THREE.Color("#FF3300"), pos: 0.87, temp: 42.0 }, // 87%
    { label: "Extreme Hot", color: new THREE.Color("#B00000"), pos: 1.00, temp: 44.0 }  // 100%
  ];

  function getThermalColorForTemp(temperature) {
    const t = Math.max(20.0, Math.min(44.0, temperature));
    for (let i = 0; i < THERMAL_GRADIENT.length - 1; i++) {
      const s0 = THERMAL_GRADIENT[i];
      const s1 = THERMAL_GRADIENT[i + 1];
      if (t >= s0.temp && t <= s1.temp) {
        const factor = (t - s0.temp) / (s1.temp - s0.temp);
        return s0.color.clone().lerp(s1.color, factor);
      }
    }
    return THERMAL_GRADIENT[THERMAL_GRADIENT.length - 1].color.clone();
  }

  function updateThermalState() {
    const legend = document.getElementById('thermal-legend');
    if (legend) legend.style.display = (showThermal && !isEmbedded) ? 'block' : 'none';
    const btnThermal = document.getElementById('btn-thermal');
    if (btnThermal) btnThermal.classList.toggle('active', showThermal);

    if (scene) {
      if (showThermal) {
        scene.background = new THREE.Color(0x0a101d);
        if (scene.fog) scene.fog.color = new THREE.Color(0x0a101d);
      } else {
        scene.background = new THREE.Color(0xd8d4ce);
        if (scene.fog) scene.fog.color = new THREE.Color(0xd8d4ce);
      }
    }

    thermalGroup.clear();

    const proj = DATA?.projects?.find(x => x.id === currentId);
    const dw = proj?.property?.dimensions_m?.width || 14.4;
    const dd = proj?.property?.dimensions_m?.depth || 11.2;

    const vLocal = new THREE.Vector3();
    const vWorld = new THREE.Vector3();

    const applyThermalToMesh = (obj) => {
      if (!obj.isMesh) return;
      if (!obj.userData.origMaterial) {
        obj.userData.origMaterial = obj.material;
      }
      if (!showThermal) {
        obj.material = obj.userData.origMaterial;
        return;
      }

      const geo = obj.geometry;
      if (!geo || !geo.attributes.position) return;

      obj.updateMatrixWorld(true);
      const pos = geo.attributes.position;
      const count = pos.count;

      if (!obj.userData.thermalColors || obj.userData.thermalColors.length !== count * 3) {
        obj.userData.thermalColors = new Float32Array(count * 3);
      }
      const colors = obj.userData.thermalColors;

      const name = (obj.name || '').toLowerCase();
      const isFloor = /floor/i.test(name) || obj.position.y < FLOOR_TOP + 0.06;
      const isCeil = /^Ceil_/i.test(obj.name) || obj.parent === ceilingGroup;
      const isWindow = /glass|window/i.test(name) || (obj.userData.origMaterial?.opacity < 0.9);

      // Handle 4-layer physical wall assembly cutaway
      if (obj.userData.cutawayLayer) {
        const layer = obj.userData.cutawayLayer;
        let c;
        if (layer === 1) {
          // Layer 1: Exterior Plaster (15mm) -> Sol-Air surface 42.4°C
          c = getThermalColorForTemp(42.4);
        } else if (layer === 2) {
          // Layer 2: AAC Block (200mm) -> Simulated thermal gradient across wall assembly (41.0°C to 32.0°C)
          for (let i = 0; i < count; i++) {
            vLocal.set(pos.getX(i), pos.getY(i), pos.getZ(i));
            vWorld.copy(vLocal).applyMatrix4(obj.matrixWorld);
            const tParam = Math.max(0, Math.min(1, (vWorld.x - (-0.35)) / 0.20));
            const tGrad = 41.0 - tParam * (41.0 - 32.0);
            const col = getThermalColorForTemp(tGrad);
            colors[i * 3] = col.r;
            colors[i * 3 + 1] = col.g;
            colors[i * 3 + 2] = col.b;
          }
          geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          geo.attributes.color.needsUpdate = true;
          if (!obj.userData.thermalMaterial) {
            obj.userData.thermalMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 });
          }
          obj.material = obj.userData.thermalMaterial;
          return;
        } else if (layer === 3) {
          // Layer 3: Insulation (50mm) -> Thermal break (32.0°C to 25.0°C)
          for (let i = 0; i < count; i++) {
            vLocal.set(pos.getX(i), pos.getY(i), pos.getZ(i));
            vWorld.copy(vLocal).applyMatrix4(obj.matrixWorld);
            const tParam = Math.max(0, Math.min(1, (vWorld.x - (-0.15)) / 0.05));
            const tGrad = 32.0 - tParam * (32.0 - 25.0);
            const col = getThermalColorForTemp(tGrad);
            colors[i * 3] = col.r;
            colors[i * 3 + 1] = col.g;
            colors[i * 3 + 2] = col.b;
          }
          geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          geo.attributes.color.needsUpdate = true;
          if (!obj.userData.thermalMaterial) {
            obj.userData.thermalMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8 });
          }
          obj.material = obj.userData.thermalMaterial;
          return;
        } else {
          // Layer 4: Interior Plaster (12mm) -> Comfortable operative finish 24.2°C
          c = getThermalColorForTemp(24.2);
        }
        for (let i = 0; i < count; i++) {
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.attributes.color.needsUpdate = true;
        if (!obj.userData.thermalMaterial) {
          obj.userData.thermalMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75 });
        }
        obj.material = obj.userData.thermalMaterial;
        return;
      }

      // Outer site landscaping plane: Keep ambient neutral 31.5°C (NOT freezing blue!)
      if (obj.userData.isOuterGround) {
        const cGround = getThermalColorForTemp(31.5);
        for (let i = 0; i < count; i++) {
          colors[i * 3] = cGround.r * 0.78;
          colors[i * 3 + 1] = cGround.g * 0.78;
          colors[i * 3 + 2] = cGround.b * 0.78;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.attributes.color.needsUpdate = true;
        if (!obj.userData.thermalMaterial) {
          obj.userData.thermalMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 });
        }
        obj.material = obj.userData.thermalMaterial;
        return;
      }

      for (let i = 0; i < count; i++) {
        vLocal.set(pos.getX(i), pos.getY(i), pos.getZ(i));
        vWorld.copy(vLocal).applyMatrix4(obj.matrixWorld);

        const wx = vWorld.x;
        const wy = vWorld.y;
        const wz = vWorld.z;

        // Distance to outer building envelope
        const dEast = Math.max(0, wx - 0.2);
        const dWest = Math.max(0, (dw + 0.2) - wx);
        const dNorth = Math.max(0, wz - 0.2);
        const dSouth = Math.max(0, (dd + 0.2) - wz);
        const dPerimeter = Math.min(dEast, dWest, dNorth, dSouth);

        // Solar-Differential Facades:
        // South facade (wz -> dd) & West facade (wx -> 0.2) receive direct sun (#FF3300 -> #B00000)
        // Shaded North facade (wz -> 0.2) & East facade transition toward warm orange (#FFE600 -> #FF8C00)
        const southFactor = Math.max(0, Math.min(1, wz / dd));
        const westFactor = Math.max(0, Math.min(1, 1.0 - (wx / dw)));
        const solarIrradiance = Math.max(0, Math.min(1, (southFactor * 0.65) + (westFactor * 0.35)));

        // Exterior surface temperature (36.0°C shaded North/East up to 43.8°C direct sun South/West)
        const tExteriorSurface = 36.0 + 7.8 * solarIrradiance;

        // Interior base operative comfort: Centered strictly at 23.8°C - 24.5°C (matching badge's 24.2°C)
        let tIndoor = 24.2;

        // Thermal stack stratification (+0.6°C towards 2.8m ceiling)
        const zStrat = Math.max(0, Math.min(1, (wy - FLOOR_TOP) / 2.8)) * 0.6;

        // Floor slab temperature (23.5°C comfortable cool neutral)
        let floorSink = 0;
        if (obj.userData.isRoomFloor || isFloor) {
          floorSink = -0.7;
        }

        // Cross-ventilation airflow corridor cooling through central zone
        const ventCooling = Math.exp(-((wx - dw * 0.45)**2 + (wz - dd * 0.48)**2) / 12.0) * (-0.8);

        // Simulated thermal gradient across wall envelope thickness (exponential decay into interior)
        const thermalDecay = Math.exp(-7.2 * dPerimeter);
        let temp = (tIndoor + zStrat + floorSink + ventCooling) + (tExteriorSurface - tIndoor) * thermalDecay;

        if (isWindow) {
          // High-performance framed glazed window
          temp = 25.8 + 1.6 * solarIrradiance;
        } else if (isCeil) {
          // Roof receives intense solar irradiation (43.5°C - 44.0°C)
          temp = 43.5 + 0.5 * solarIrradiance;
        }

        // Map physical temperature [20.0°C - 44.0°C] into 8-stop colormap
        const col = getThermalColorForTemp(temp);

        colors[i * 3] = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.attributes.color.needsUpdate = true;

      if (!obj.userData.thermalMaterial) {
        obj.userData.thermalMaterial = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: isFloor ? 0.28 : 0.42,
          metalness: 0.04,
          transparent: isWindow,
          opacity: isWindow ? 0.72 : 1.0
        });
      }
      obj.material = obj.userData.thermalMaterial;
    };

    interiorGroup.traverse(applyThermalToMesh);
    ceilingGroup.traverse(applyThermalToMesh);

    // Only show 3D text sprites when in standalone viewer mode (NOT when embedded in parent dashboard)
    if (showThermal && proj?.layout?.rooms && !isEmbedded) {
      proj.layout.rooms.forEach(r => {
        const cx = r.rect.x + r.rect.w / 2;
        const cz = r.rect.y + r.rect.h / 2;
        const cy = DOLLHOUSE_WALL_H + 0.55;
        let label = `${r.name}: 24.2°C`;
        let bg = 'rgba(0, 102, 255, 0.92)';
        let border = '#0066FF';

        if (/living/i.test(r.name)) {
          label = `🛋️ Living: 24.6°C`;
          bg = 'rgba(0, 207, 255, 0.92)';
          border = '#00CFFF';
        } else if (/master|bed/i.test(r.name)) {
          label = `🛏️ ${r.name}: 24.2°C`;
          bg = 'rgba(0, 102, 255, 0.92)';
          border = '#0066FF';
        } else if (/kitchen/i.test(r.name)) {
          label = `🍳 Kitchen: 25.4°C`;
          bg = 'rgba(0, 255, 102, 0.92)';
          border = '#00FF66';
        } else if (/pooja/i.test(r.name)) {
          label = `🕉️ Pooja: 24.0°C`;
          bg = 'rgba(0, 102, 255, 0.92)';
          border = '#0066FF';
        }

        const sp = makeTextSprite(label, bg, '#ffffff', border);
        sp.position.set(cx, cy, cz);
        thermalGroup.add(sp);
      });

      const spExt = makeTextSprite('☀️ Sol-Air Facade: 42.4°C', 'rgba(176, 0, 0, 0.92)', '#ffffff', '#FF3300');
      spExt.position.set(dw * 0.5, DOLLHOUSE_WALL_H + 0.85, dd + 0.5);
      thermalGroup.add(spExt);
    }
  }

  function initAirflowStreamlines() {
    airflowGroup.clear();
    airflowParticles = [];
    const btnAirflow = document.getElementById('btn-airflow');
    if (btnAirflow) btnAirflow.classList.toggle('active', showAirflow);

    if (!showAirflow) return;

    const proj = DATA?.projects?.find(x => x.id === currentId);
    const dw = proj?.property?.dimensions_m?.width || 14.4;
    const dd = proj?.property?.dimensions_m?.depth || 11.2;

    // Streamlines entering from exterior windows and flowing toward exhaust points
    const curves = [
      // Streamline 1: Enters North Living Window -> crosses Living & Dining -> exhausts out South Bed 2 window
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(2.4, 0.95, -0.6),
        new THREE.Vector3(2.6, 0.98, 2.0),
        new THREE.Vector3(5.0, 1.05, 3.8),
        new THREE.Vector3(7.2, 1.02, 6.8),
        new THREE.Vector3(7.4, 1.05, dd + 0.8),
      ]),
      // Streamline 2: Enters West Living Window -> flows past dining -> crosses into Kitchen -> exhausts out East Kitchen window
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.8, 1.0, 2.5),
        new THREE.Vector3(2.5, 1.0, 2.8),
        new THREE.Vector3(6.0, 1.05, 3.4),
        new THREE.Vector3(10.6, 1.1, 3.2),
        new THREE.Vector3(dw + 0.8, 1.15, 2.4),
      ]),
      // Streamline 3: Enters Master Bedroom West window -> circulates -> exhausts out Attached Bath ventilation
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.8, 0.95, 6.8),
        new THREE.Vector3(2.0, 0.98, 6.8),
        new THREE.Vector3(2.0, 1.05, 9.2),
        new THREE.Vector3(1.2, 1.2, 10.4),
        new THREE.Vector3(-0.8, 1.3, 10.4),
      ]),
      // Streamline 4: Stack ventilation updraft through central core
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(dw * 0.48, 0.25, dd * 0.45),
        new THREE.Vector3(dw * 0.48, 1.2, dd * 0.45),
        new THREE.Vector3(dw * 0.48, 2.8, dd * 0.45),
      ])
    ];

    curves.forEach((curve, ci) => {
      const pts = curve.getPoints(50);
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const lineMat = new THREE.LineBasicMaterial({
        color: ci === 3 ? 0xffeb3b : 0x00cfff,
        transparent: true,
        opacity: 0.38
      });
      airflowGroup.add(new THREE.Line(lineGeo, lineMat));

      const count = 14;
      for (let i = 0; i < count; i++) {
        const pGeo = new THREE.SphereGeometry(0.065, 8, 8);
        const pMat = new THREE.MeshBasicMaterial({
          color: ci === 3 ? 0xffeb3b : (i % 2 === 0 ? 0x00cfff : 0x00ff66),
          transparent: true,
          opacity: 0.85
        });
        const particle = new THREE.Mesh(pGeo, pMat);
        airflowGroup.add(particle);
        airflowParticles.push({
          mesh: particle,
          curve: curve,
          progress: (i / count),
          speed: 0.0032 + (Math.random() * 0.0012)
        });
      }
    });
  }

  function loadProject(id) {
    currentId = id;
    if (sel) sel.value = id;
    const proj = DATA.projects.find(p => p.id === id);
    if (!proj) return;
    buildScene({ ...proj, catalog: DATA.catalog });
  }
  window.loadProject = loadProject;
  window.setViewMode = setViewMode;

  function showToast(msg, isWarn = false) {
    let toast = document.getElementById('viewer-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'viewer-toast';
      toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(28,31,34,0.92);color:#fff;padding:9px 18px;border-radius:24px;font-size:12px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.25);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);transition:opacity 0.3s ease;pointer-events:none;';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    toast.style.borderColor = isWarn ? '#DE7236' : 'rgba(255,255,255,0.15)';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 4000);
  }

  function loadGLB() {
    if (location.protocol === 'file:') { showToast('Please open via local server http://localhost:8765', true); return; }
    const proj = DATA.projects.find(p => p.id === currentId);
    if (!proj?.assets?.glb) {
      showToast('Procedural 3D active (Blender GLB export is optional).');
      return;
    }
    showToast('Loading pre-baked Blender GLB...');
    new GLTFLoader().load(proj.assets.glb, gltf => {
      interiorGroup.clear();
      ceilingGroup.clear();
      sceneLights.clear();
      loadedGlb = true;
      gltf.scene.traverse(obj => {
        if (!obj.isMesh) return;
        if (/^Ceil_/i.test(obj.name)) {
          obj.visible = showRoof;
          ceilingGroup.attach(obj);
        }
      });
      interiorGroup.add(gltf.scene);
      applyRoofVisibility();
      applyViewClipping();
      if (viewMode === 'dollhouse') setCameraForMode(proj.property, proj.layout?.wall_height_m || 2.85);
      showToast('Blender GLB loaded successfully.');
    }, undefined, () => {
      showToast('Procedural Three.js 3D active. Run: python scripts/run_advanced_render.py for Blender baking.');
    });
  }

  function setViewMode(mode) {
    viewMode = mode;
    touring = mode === 'walkthrough';
    if (touring) tourT = 0;
    document.getElementById('btn-dollhouse')?.classList.toggle('active', mode === 'dollhouse');
    document.getElementById('btn-orbit')?.classList.toggle('active', mode === 'orbit');
    document.getElementById('btn-tour')?.classList.toggle('active', mode === 'walkthrough');

    if (mode === 'cutaway') {
      const proj = DATA?.projects?.find(p => p.id === currentId);
      const dd = proj?.property?.dimensions_m?.depth || 11.2;
      const targetX = -0.25;
      const targetZ = dd * 0.5;
      camera.position.set(targetX - 2.8, 1.8, targetZ + 1.8);
      controls.target.set(targetX, 0.75, targetZ);
      controls.update();
      applyViewClipping();
      return;
    }

    if (!loadedGlb) loadProject(currentId);
    else {
      applyViewClipping();
      const proj = DATA.projects.find(p => p.id === currentId);
      if (proj) setCameraForMode(proj.property, proj.layout?.wall_height_m || 2.85);
    }
  }

  function tick() {
    requestAnimationFrame(tick);
    if (touring && tourPoints.length > 1) {
      tourT += 0.0035;
      if (tourT > 1) tourT = 0;
      const idx = Math.min(Math.floor(tourT * (tourPoints.length - 1)), tourPoints.length - 2);
      const t = (tourT * (tourPoints.length - 1)) - idx;
      camera.position.lerpVectors(tourPoints[idx].pos, tourPoints[idx + 1].pos, t);
      const look = new THREE.Vector3().lerpVectors(tourPoints[idx].look, tourPoints[idx + 1].look, t);
      camera.lookAt(look);
      controls.target.copy(look);
    } else controls.update();

    if (showAirflow && airflowParticles.length > 0) {
      airflowParticles.forEach(p => {
        p.progress = (p.progress + p.speed) % 1.0;
        const pt = p.curve.getPoint(p.progress);
        if (pt) p.mesh.position.copy(pt);
      });
    }

    renderer.render(scene, camera);
  }

  document.getElementById('btn-dollhouse').onclick = () => setViewMode('dollhouse');
  document.getElementById('btn-orbit').onclick = () => { setViewMode('orbit'); touring = false; };
  document.getElementById('btn-tour').onclick = () => setViewMode('walkthrough');
  document.getElementById('btn-thermal').onclick = () => {
    showThermal = !showThermal;
    updateThermalState();
  };
  document.getElementById('btn-airflow').onclick = () => {
    showAirflow = !showAirflow;
    initAirflowStreamlines();
  };
  document.getElementById('btn-paths').onclick = (e) => {
    showPaths = !showPaths;
    e.target.classList.toggle('on', showPaths);
    loadProject(currentId);
  };
  document.getElementById('btn-roof').onclick = () => { showRoof = !showRoof; applyRoofVisibility(); };
  document.getElementById('btn-vastu').onclick = (e) => { e.target.classList.toggle('active'); loadProject(currentId); };
  document.getElementById('btn-glb').onclick = loadGLB;
  sel.onchange = () => { loadedGlb = false; loadProject(sel.value); };

  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'SET_MODE') setViewMode(e.data.mode);
    if (e.data.type === 'TOGGLE_THERMAL') {
      showThermal = e.data.value !== undefined ? e.data.value : !showThermal;
      updateThermalState();
    }
    if (e.data.type === 'TOGGLE_AIRFLOW') {
      showAirflow = e.data.value !== undefined ? e.data.value : !showAirflow;
      initAirflowStreamlines();
    }
    if (e.data.type === 'TOGGLE_ROOF') {
      showRoof = e.data.value !== undefined ? e.data.value : !showRoof;
      applyRoofVisibility();
    }
    if (e.data.type === 'SET_PROJECT') {
      if (e.data.project) loadProject(e.data.project);
    }
  });

  init();
  if (DATA?.projects?.length) loadProject(currentId);
  </script>
</body>
