<script type="module">

import * as THREE
from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
    Lut
}
from "three/addons/math/Lut.js";


/* =========================================================
   CFD INPUT
========================================================= */

const CFD = {

    ambientTemperature: -15,

    solarRadiation: 480,

    windSpeed: 8,

    windDirection: "NW",

    temperatureMin: -20,

    temperatureMax: 25,


    house: {

        width: 16,

        depth: 11,

        wallHeight: 3.2,

        foundationHeight: .65,

        wallThickness: .25,


        roofThickness: .22,

        parapetHeight: .38,


        porch: {

            width: 7.2,

            depth: 2.5,

            height: 3.0

        },


        raisedRoof: {

            x: 2.0,

            z: 1.1,

            width: 5,

            depth: 3.6,

            height: 1.25

        },


        chimney: {

            x: -4.8,

            z: 1.8,

            width: 1,

            depth: 1,

            height: 1.55

        }

    }

};


/* =========================================================
   GLOBALS
========================================================= */

let scene;

let camera;

let renderer;

let controls;

let house;

let thermalMeshes = [];

let thermalMaterials = [];

let windGroup;

let heatGroup;

let probeGroup;

let sectionPlane;

let sectionEnabled = false;

let wireEnabled = false;

let currentMode = "thermal";

let clock;


/* =========================================================
   LUT
========================================================= */

const lut =
    new Lut(
        "rainbow",
        256
    );

lut.setMin(
    CFD.temperatureMin
);

lut.setMax(
    CFD.temperatureMax
);


/* =========================================================
   INIT
========================================================= */

init();


function init() {

    clock =
        new THREE.Clock();


    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x071522
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            42,
            innerWidth / innerHeight,
            .1,
            200
        );


    camera.position.set(
        22,
        11,
        -24
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.shadowMap.enabled =
        true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.1;


    renderer.localClippingEnabled =
        true;


    document
        .getElementById(
            "viewport"
        )
        .appendChild(
            renderer.domElement
        );


    /* LIGHT */

    createLighting();


    /* HOUSE */

    house =
        new THREE.Group();

    house.name =
        "ThermalHouse";

    scene.add(
        house
    );


    buildHouse();


    /* GROUND */

    createGround();


    /* SIMULATION GROUPS */

    windGroup =
        new THREE.Group();

    heatGroup =
        new THREE.Group();

    probeGroup =
        new THREE.Group();


    scene.add(
        windGroup,
        heatGroup,
        probeGroup
    );


    /* SIMULATIONS */

    createWindFlow();

    createThermalFlow();

    createProbes();


    /* SECTION */

    sectionPlane =
        new THREE.Plane(
            new THREE.Vector3(
                0,
                0,
                1
            ),
            0
        );


    /* CONTROLS */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.target.set(
        0,
        2.2,
        0
    );


    controls.enableDamping =
        true;

    controls.dampingFactor =
        .06;

    controls.minDistance =
        10;

    controls.maxDistance =
        55;

    controls.maxPolarAngle =
        Math.PI * .49;


    setupUI();


    window.addEventListener(
        "resize",
        resize
    );


    renderer.setAnimationLoop(
        animate
    );

}


/* =========================================================
   LIGHTING
========================================================= */

function createLighting() {

    const sky =
        new THREE.HemisphereLight(
            0xdceeff,
            0x182028,
            2
        );

    scene.add(
        sky
    );


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3.2
        );


    sun.position.set(
        -15,
        28,
        -18
    );


    sun.castShadow =
        true;


    sun.shadow.mapSize.set(
        2048,
        2048
    );


    scene.add(
        sun
    );


    const fill =
        new THREE.DirectionalLight(
            0x7fb8ff,
            .65
        );


    fill.position.set(
        15,
        12,
        20
    );


    scene.add(
        fill
    );

}


/* =========================================================
   THERMAL COLOR
========================================================= */

function thermalColor(
    temperature
) {

    return lut
        .getColor(
            temperature
        )
        .clone();

}


/* =========================================================
   TEMPERATURE MODEL
========================================================= */

function surfaceTemperature(
    surface,
    x,
    y,
    z = 0
) {

    let T =
        CFD.ambientTemperature;


    if (
        surface === "south"
    )
        T += 23;


    if (
        surface === "north"
    )
        T += 7;


    if (
        surface === "east"
    )
        T += 15;


    if (
        surface === "west"
    )
        T += 13;


    if (
        surface === "roof"
    )
        T += 24;


    if (
        surface === "window"
    )
        T += 27;


    if (
        surface === "door"
    )
        T += 19;


    /*
       Wind cooling
    */

    T -=
        CFD.windSpeed *
        .18;


    /*
       Vertical gradient
    */

    T +=
        Math.max(
            0,
            y
        ) *
        .55;


    /*
       South solar hotspot
    */

    if (
        surface === "south"
    ) {

        T +=
            Math.max(
                0,
                5 -
                Math.abs(x) *
                .65
            );

    }


    /*
       Roof hotspot
    */

    if (
        surface === "roof"
    ) {

        const d =
            Math.sqrt(
                x * x +
                z * z
            );

        T +=
            Math.max(
                0,
                8 -
                d * .55
            );

    }


    return T;

}


/* =========================================================
   REAL SOLID WALL
========================================================= */

function createSolidWall(
    width,
    height,
    depth,
    x,
    y,
    z
) {

    /*
       This is the actual wall volume.

       This fixes the previous issue where
       the house consisted mainly of planes.
    */

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0xeeeeee,

            roughness:
                .78,

            metalness:
                .02

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;


    house.add(
        mesh
    );


    return mesh;

}


/* =========================================================
   THERMAL WALL OVERLAY
========================================================= */

function createThermalWall(
    width,
    height,
    position,
    rotation,
    surface,
    segmentsX = 20,
    segmentsY = 10
) {

    const geometry =
        new THREE.PlaneGeometry(
            width,
            height,
            segmentsX,
            segmentsY
        );


    const positions =
        geometry.attributes.position;


    const colors =
        new Float32Array(
            positions.count * 3
        );


    const temps =
        new Float32Array(
            positions.count
        );


    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        const x =
            positions.getX(i);

        const y =
            positions.getY(i);


        const T =
            surfaceTemperature(
                surface,
                x,
                y
            );


        temps[i] =
            T;


        const c =
            thermalColor(
                T
            );


        colors[
            i * 3
        ] = c.r;

        colors[
            i * 3 + 1
        ] = c.g;

        colors[
            i * 3 + 2
        ] = c.b;

    }


    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            colors,
            3
        )
    );


    geometry.setAttribute(
        "temperature",
        new THREE.Float32BufferAttribute(
            temps,
            1
        )
    );


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            vertexColors: true,

            roughness: .72,

            metalness: .02,

            side:
                THREE.DoubleSide

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.copy(
        position
    );

    mesh.rotation.copy(
        rotation
    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    mesh.userData.surface =
        surface;


    house.add(
        mesh
    );


    thermalMeshes.push(
        mesh
    );

    thermalMaterials.push(
        material
    );


    return mesh;

}


/* =========================================================
   THERMAL ROOF
========================================================= */

function createThermalRoof() {

    const H =
        CFD.house;


    const width =
        H.width + .45;

    const depth =
        H.depth + .45;


    const y =
        H.foundationHeight +
        H.wallHeight +
        H.roofThickness;


    const geometry =
        new THREE.PlaneGeometry(
            width,
            depth,
            24,
            18
        );


    const positions =
        geometry.attributes.position;


    const colors =
        new Float32Array(
            positions.count * 3
        );


    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        const x =
            positions.getX(i);

        const z =
            positions.getY(i);


        const T =
            surfaceTemperature(
                "roof",
                x,
                0,
                z
            );


        const c =
            thermalColor(
                T
            );


        colors[
            i * 3
        ] = c.r;

        colors[
            i * 3 + 1
        ] = c.g;

        colors[
            i * 3 + 2
        ] = c.b;

    }


    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            colors,
            3
        )
    );


    const material =
        new THREE.MeshStandardMaterial({

            vertexColors: true,

            roughness: .72,

            side:
                THREE.DoubleSide

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.rotation.x =
        -Math.PI / 2;


    mesh.position.y =
        y;


    mesh.userData.surface =
        "roof";


    house.add(
        mesh
    );


    thermalMeshes.push(
        mesh
    );


    thermalMaterials.push(
        material
    );

}


/* =========================================================
   BUILD HOUSE
========================================================= */

function buildHouse() {

    const H =
        CFD.house;


    const W =
        H.width;

    const D =
        H.depth;

    const wallY =
        H.foundationHeight +
        H.wallHeight / 2;


    /*
       ACTUAL WALL VOLUMES
    */

    createSolidWall(
        W,
        H.wallHeight,
        H.wallThickness,

        0,
        wallY,
        -D / 2
    );


    createSolidWall(
        W,
        H.wallHeight,
        H.wallThickness,

        0,
        wallY,
        D / 2
    );


    createSolidWall(
        H.wallThickness,
        H.wallHeight,
        D,

        -W / 2,
        wallY,
        0
    );


    createSolidWall(
        H.wallThickness,
        H.wallHeight,
        D,

        W / 2,
        wallY,
        0
    );


    /*
       THERMAL OUTER SURFACES

       Slightly outside the actual wall.
    */

    createThermalWall(
        W,
        H.wallHeight,

        new THREE.Vector3(
            0,
            wallY,
            -D / 2 -
            H.wallThickness / 2 -
            .006
        ),

        new THREE.Euler(
            0,
            0,
            0
        ),

        "south"
    );


    createThermalWall(
        W,
        H.wallHeight,

        new THREE.Vector3(
            0,
            wallY,
            D / 2 +
            H.wallThickness / 2 +
            .006
        ),

        new THREE.Euler(
            0,
            Math.PI,
            0
        ),

        "north"
    );


    createThermalWall(
        D,
        H.wallHeight,

        new THREE.Vector3(
            -W / 2 -
            H.wallThickness / 2 -
            .006,
            wallY,
            0
        ),

        new THREE.Euler(
            0,
            -Math.PI / 2,
            0
        ),

        "west"
    );


    createThermalWall(
        D,
        H.wallHeight,

        new THREE.Vector3(
            W / 2 +
            H.wallThickness / 2 +
            .006,
            wallY,
            0
        ),

        new THREE.Euler(
            0,
            Math.PI / 2,
            0
        ),

        "east"
    );


    /*
       Foundation
    */

    createFoundation();


    /*
       Roof
    */

    createThermalRoof();


    createParapet();


    /*
       Raised roof
    */

    createRaisedRoof();


    /*
       Porch
    */

    createPorch();


    /*
       Windows / doors
    */

    createFrontWindows();

    createSideWindows();

    createRearWindows();


    /*
       Chimney
    */

    createChimney();


    /*
       Steps
    */

    createSteps();

}


/* =========================================================
   FOUNDATION
========================================================= */

function createFoundation() {

    const H =
        CFD.house;


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x686d6d,

            roughness:
                .95

        });


    addBox(

        H.width + .9,

        H.foundationHeight,

        H.depth + .9,

        0,

        H.foundationHeight / 2,

        0,

        material

    );

}


/* =========================================================
   PARAPET
========================================================= */

function createParapet() {

    const H =
        CFD.house;


    const y =
        H.foundationHeight +
        H.wallHeight +
        H.roofThickness;


    const h =
        H.parapetHeight;


    const W =
        H.width + .45;

    const D =
        H.depth + .45;


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0xe3e5e4,

            roughness:
                .72

        });


    addBox(
        W,
        h,
        .18,
        0,
        y + h / 2,
        -D / 2,
        material
    );


    addBox(
        W,
        h,
        .18,
        0,
        y + h / 2,
        D / 2,
        material
    );


    addBox(
        .18,
        h,
        D,
        -W / 2,
        y + h / 2,
        0,
        material
    );


    addBox(
        .18,
        h,
        D,
        W / 2,
        y + h / 2,
        0,
        material
    );

}


/* =========================================================
   RAISED ROOF
========================================================= */

function createRaisedRoof() {

    const R =
        CFD.house.raisedRoof;

    const H =
        CFD.house;


    const baseY =
        H.foundationHeight +
        H.wallHeight +
        H.roofThickness;


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0xd9dcdb,

            roughness:
                .76

        });


    addBox(

        R.width,
        R.height,
        R.depth,

        R.x,

        baseY +
        R.height / 2,

        R.z,

        material

    );


    addBox(

        R.width + .25,
        .20,
        R.depth + .25,

        R.x,

        baseY +
        R.height +
        .1,

        R.z,

        material

    );


    /*
       Raised roof thermal surface
    */

    const frontWindow =
        createSimpleWindow(

            R.width * .55,
            .8,

            R.x,

            baseY + .6,

            R.z -
            R.depth / 2 -
            .01,

            0

        );

}


/* =========================================================
   PORCH
========================================================= */

function createPorch() {

    const H =
        CFD.house;

    const P =
        H.porch;


    const z =
        -H.depth / 2 -
        P.depth / 2;


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x888b8b,

            roughness:
                .9

        });


    addBox(
        P.width,
        .20,
        P.depth,
        0,
        H.foundationHeight + .1,
        z,
        material
    );


    addBox(
        P.width + .4,
        .25,
        P.depth + .35,
        0,
        H.foundationHeight +
        P.height,
        z,
        new THREE.MeshStandardMaterial({
            color: 0xe0e2e0,
            roughness: .72
        })
    );


    /*
       columns
    */

    const columnMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0xe0e1df,

            roughness:
                .72

        });


    addBox(
        .25,
        P.height,
        .25,

        -P.width / 2 + .3,

        H.foundationHeight +
        P.height / 2,

        z,

        columnMaterial
    );


    addBox(
        .25,
        P.height,
        .25,

        P.width / 2 - .3,

        H.foundationHeight +
        P.height / 2,

        z,

        columnMaterial
    );

}


/* =========================================================
   WINDOWS
========================================================= */

function createSimpleWindow(
    width,
    height,
    x,
    y,
    z,
    rotationY
) {

    const geometry =
        new THREE.PlaneGeometry(
            width,
            height,
            8,
            5
        );


    const colors =
        new Float32Array(
            geometry.attributes.position.count *
            3
        );


    for (
        let i = 0;
        i <
        geometry.attributes.position.count;
        i++
    ) {

        const p =
            geometry.attributes.position;


        const T =
            CFD.ambientTemperature +
            28 -
            CFD.windSpeed * .1;


        const c =
            thermalColor(T);


        colors[i * 3] =
            c.r;

        colors[i * 3 + 1] =
            c.g;

        colors[i * 3 + 2] =
            c.b;

    }


    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            colors,
            3
        )
    );


    const material =
        new THREE.MeshStandardMaterial({

            vertexColors: true,

            transparent: true,

            opacity: .82,

            roughness: .12,

            metalness: .1,

            side:
                THREE.DoubleSide

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.rotation.y =
        rotationY;


    house.add(
        mesh
    );


    thermalMeshes.push(
        mesh
    );


    createWindowFrame(
        width,
        height,
        x,
        y,
        z,
        rotationY
    );


    return mesh;

}


/* =========================================================
   WINDOW FRAME
========================================================= */

function createWindowFrame(
    width,
    height,
    x,
    y,
    z,
    rotationY
) {

    const group =
        new THREE.Group();


    group.position.set(
        x,
        y,
        z -
        .025
    );


    group.rotation.y =
        rotationY;


    house.add(
        group
    );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x3d2c20,

            roughness:
                .75

        });


    addGroupBox(
        group,
        width + .16,
        .10,
        .10,
        0,
        height / 2,
        0,
        material
    );


    addGroupBox(
        group,
        width + .16,
        .10,
        .10,
        0,
        -height / 2,
        0,
        material
    );


    addGroupBox(
        group,
        .10,
        height,
        .10,
        -width / 2,
        0,
        0,
        material
    );


    addGroupBox(
        group,
        .10,
        height,
        .10,
        width / 2,
        0,
        0,
        material
    );


    /*
       Mullion
    */

    addGroupBox(
        group,
        .06,
        height,
        .10,
        0,
        0,
        0,
        material
    );

}

/* =========================================================
   WIND FLOW SIMULATION
========================================================= */

function createWindFlow() {

    /*
       Wind comes from NW.

       Instead of static arrows, create
       many animated particles following
       curved streamlines around the house.
    */

    const curves = [];

    const zPositions =
        [
            -7,
            -5.8,
            -4.6,
            -3.4,
            -2.2,
            -1,
            0,
            1,
            2.2,
            3.4,
            4.6,
            5.8,
            7
        ];


    zPositions.forEach(
        (z, index) => {

            const curve =
                new THREE.CatmullRomCurve3([

                    new THREE.Vector3(
                        -25,
                        2.5 +
                        index * .18,
                        z
                    ),

                    new THREE.Vector3(
                        -12,
                        2.8,
                        z
                    ),

                    new THREE.Vector3(
                        -8,
                        3.2 +
                        Math.abs(z) * .08,
                        z
                    ),

                    new THREE.Vector3(
                        -5,
                        3.5 +
                        Math.max(
                            0,
                            3 -
                            Math.abs(z)
                        ),
                        z
                    ),

                    new THREE.Vector3(
                        0,
                        4.0 +
                        Math.max(
                            0,
                            3 -
                            Math.abs(z)
                        ),
                        z * .8
                    ),

                    new THREE.Vector3(
                        7,
                        3.5,
                        z * 1.05
                    ),

                    new THREE.Vector3(
                        14,
                        3.0,
                        z * 1.15
                    ),

                    new THREE.Vector3(
                        25,
                        3.2,
                        z * 1.25
                    )

                ]);


            curves.push(
                curve
            );


            /*
               Streamline
            */

            const points =
                curve.getPoints(
                    80
                );


            const geometry =
                new THREE.BufferGeometry()
                    .setFromPoints(
                        points
                    );


            const material =
                new THREE.LineBasicMaterial({

                    color:
                        0x00aaff,

                    transparent:
                        true,

                    opacity:
                        .28

                });


            const line =
                new THREE.Line(
                    geometry,
                    material
                );


            windGroup.add(
                line
            );

        }
    );


    /*
       Animated wind particles
    */

    for (
        let i = 0;
        i < 130;
        i++
    ) {

        const curve =
            curves[
                i %
                curves.length
            ];


        const particle =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .055,
                    6,
                    6
                ),

                new THREE.MeshBasicMaterial({

                    color:
                        new THREE.Color(
                            0x00bfff
                        ),

                    transparent:
                        true,

                    opacity:
                        .9

                })

            );


        particle.userData.curve =
            curve;

        particle.userData.offset =
            Math.random();


        windGroup.add(
            particle
        );

    }

}


/* =========================================================
   THERMAL FLOW SIMULATION
========================================================= */

function createThermalFlow() {

    /*
       Heat-loss visualization.

       Particles originate near the building
       envelope and travel outward.

       This represents heat flux direction,
       NOT a Fluent solver result.
    */

    const origins = [];


    /*
       South wall
    */

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        origins.push({

            start:
                new THREE.Vector3(

                    -7 +
                    Math.random() *
                    14,

                    .7 +
                    Math.random() *
                    2.2,

                    -5.7

                ),

            direction:
                new THREE.Vector3(
                    0,
                    0,
                    -1
                )

        });

    }


    /*
       Roof
    */

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        origins.push({

            start:
                new THREE.Vector3(

                    -7 +
                    Math.random() *
                    14,

                    4.05,

                    -5 +
                    Math.random() *
                    10

                ),

            direction:
                new THREE.Vector3(
                    0,
                    1,
                    0
                )

        });

    }


    origins.forEach(
        data => {

            const material =
                new THREE.MeshBasicMaterial({

                    color:
                        0xff6b00,

                    transparent:
                        true,

                    opacity:
                        .85

                });


            const particle =
                new THREE.Mesh(

                    new THREE.SphereGeometry(
                        .07,
                        6,
                        6
                    ),

                    material

                );


            particle.position.copy(
                data.start
            );


            particle.userData.start =
                data.start.clone();


            particle.userData.direction =
                data.direction.clone();


            particle.userData.speed =
                .25 +
                Math.random() *
                .35;


            particle.userData.life =
                Math.random();


            heatGroup.add(
                particle
            );

        }
    );

}

/* =========================================================
   BOX HELPERS
========================================================= */

function addBox(
    width,
    height,
    depth,
    x,
    y,
    z,
    material
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;


    house.add(
        mesh
    );


    return mesh;

}


function addGroupBox(
    group,
    width,
    height,
    depth,
    x,
    y,
    z,
    material
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        x,
        y,
        z
    );


    group.add(
        mesh
    );


    return mesh;

}

        );

        document.getElementById(
            "heatBtn"
        );

        );

        );

            "frontBtn"
        );

    const top =
        document.getElementById(
            "topBtn"
        );


    thermal.onclick =
        () => {

            setMode(
                "thermal",
                thermal
            );

        };


    wind.onclick =
        () => {

            setMode(
                "wind",
                wind
            );

        };


    heat.onclick =
        () => {

            setMode(
                "heat",
                heat
            );

        };


    wire.onclick =
        () => {

            wireEnabled =
                !wireEnabled;

            thermalMeshes.forEach(
                mesh => {

                    mesh.material.wireframe =
                        wireEnabled;

                }
            );

            wire.classList.toggle(
                "active",
                wireEnabled
            );

        };


    section.onclick =
        () => {

            sectionEnabled =
                !sectionEnabled;

            applySectionCut(
                sectionEnabled
            );

            section.classList.toggle(
                "active",
                sectionEnabled
            );

        };


    front.onclick =
        () => {

            camera.position.set(
                0,
                6,
                -25
            );

            controls.target.set(
                0,
                2.2,
                0
            );

            controls.update();

        };


    top.onclick =
        () => {

            camera.position.set(
                0,
                30,
                .01
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();

        };

}


/* =========================================================
   MODE
========================================================= */

function setMode(
    mode,
    button
) {

    currentMode =
        mode;


    document
        .querySelectorAll(
            "#controls button"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    thermalMeshes.forEach(
        mesh => {

            mesh.visible =
                mode !== "wind" &&
                mode !== "heat";

        }
    );


    windGroup.visible =
        mode === "wind";


    heatGroup.visible =
        mode === "heat";

}


/* =========================================================
   SECTION CUT
========================================================= */

function applySectionCut(
    enabled
) {

    if (
        !enabled
    ) {

        thermalMaterials.forEach(
            material => {

                material.clippingPlanes =
                    [];

            }
        );

        return;

    }


    /*
       Cut through the center.

       Everything on the negative Z
       side is removed.
    */

    sectionPlane =
        new THREE.Plane(
            new THREE.Vector3(
                0,
                0,
                1
            ),
            0
        );


    thermalMaterials.forEach(
        material => {

            material.clippingPlanes =
                [
                    sectionPlane
                ];

            material.clipShadows =
                true;

        }
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    const time =
        clock.getElapsedTime();


    controls.update();


    /*
       WIND PARTICLES
    */

    windGroup.children
        .forEach(
            object => {

                if (
                    !object.userData.curve
                )
                    return;


                const curve =
                    object.userData.curve;


                let t =
                    (
                        time *
                        .055 +
                        object.userData.offset
                    ) % 1;


                const position =
                    curve.getPointAt(
                        t
                    );


                object.position.copy(
                    position
                );

            }
        );


    /*
       THERMAL FLOW PARTICLES
    */

    heatGroup.children
        .forEach(
            particle => {

                if (
                    !particle.userData.direction
                )
                    return;


                particle.userData.life +=
                    particle.userData.speed *
                    .012;


                if (
                    particle.userData.life >
                    1
                ) {

                    particle.userData.life =
                        0;

                }


                const life =
                    particle.userData.life;


                particle.position.copy(
                    particle.userData.start
                );


                particle.position.add(
                    particle.userData.direction
                        .clone()
                        .multiplyScalar(
                            life * 2.8
                        )
                );


                /*
                   Fade near end
                */

                particle.material.opacity =
                    Math.sin(
                        life *
                        Math.PI
                    ) * .9;

            }
        );


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    camera.aspect =
        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

}
